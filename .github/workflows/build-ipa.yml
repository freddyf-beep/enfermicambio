name: build-ipa

# Builds an IPA for sideloading with Sideloadly/AltStore using a free Apple ID
# (7-day validity, no paid developer account required). Free re-signing does not
# make HealthKit available; iPhone health data uses the Health Auto Export bridge.
#
# Configure SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets before
# dispatching the workflow; COMPETITION_TZ defaults to America/Santiago.

on:
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build IPA with Health Auto Export bridge
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart code
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Build iOS app (device, cloud unsigned)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          COMPETITION_TZ: ${{ secrets.COMPETITION_TZ || 'America/Santiago' }}
        run: |
          # --no-codesign produces an unsigned .app; the device slice is then
          # packaged and sideloaded with a free Apple ID.
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=COMPETITION_TZ="$COMPETITION_TZ"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -maxdepth 2 | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "*.app" -maxdepth 3 | head -1)
          fi
          echo "App bundle: $APP_PATH"

          # The executable name matches the Flutter target (Runner) or the
          # app name depending on PRODUCT_NAME; resolve it from the plist.
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "CFBundleExecutable: $EXEC_NAME"
          EXEC_PATH="$APP_PATH/$EXEC_NAME"

          echo "=== Built Info.plist ==="
          cat "$APP_PATH/Info.plist"

          echo "=== Binary info ==="
          file "$EXEC_PATH"
          lipo -info "$EXEC_PATH"

          # Keep only the arm64 slice for physical devices.
          lipo "$EXEC_PATH" -thin arm64 -output "/tmp/${EXEC_NAME}_arm64" 2>/dev/null \
            || cp "$EXEC_PATH" "/tmp/${EXEC_NAME}_arm64"
          echo "After lipo -thin:"
          file "/tmp/${EXEC_NAME}_arm64"

          # Retag simulator binary to device platform.
          vtool -set-build-version ios 15.0 15.0 -replace \
            -output "/tmp/${EXEC_NAME}_device" \
            "/tmp/${EXEC_NAME}_arm64" 2>/dev/null || true
          echo "After vtool:"
          vtool -show-build "/tmp/${EXEC_NAME}_device" 2>/dev/null || true

          # Replace executable with the device-tagged one.
          cp "/tmp/${EXEC_NAME}_device" "$EXEC_PATH"
          chmod +x "$EXEC_PATH"

          # Keep the HealthKit declaration for native/paid-signing builds. A
          # free re-sign may remove it; the production iPhone flow uses the
          # Health Auto Export bridge documented in docs/health_auto_export_setup.md.
          codesign --force --deep --sign - \
            --entitlements "$GITHUB_WORKSPACE/ios/Runner/Runner.entitlements" \
            --generate-entitlement-der \
            "$APP_PATH"
          echo "=== Entitlements declared by the app ==="
          codesign --display --entitlements :- "$APP_PATH" 2>&1 | tee /tmp/runner-entitlements.plist
          grep -q "com.apple.developer.healthkit" /tmp/runner-entitlements.plist

          # A device provisioning profile is still supplied by Sideloadly or
          # AltStore. Never retain a stale profile from the cloud runner.
          rm -f "$APP_PATH/embedded.mobileprovision"

          # Ensure the required Info.plist keys are present for sideloading.
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $EXEC_NAME" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP_PATH/Info.plist" 2>/dev/null || true

          echo "=== Final app contents ==="
          ls -la "$APP_PATH/"

          # Package IPA: Payload/<AppName>.app
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" "Payload/${EXEC_NAME}.app"
          echo "Executable exists: $(test -f Payload/${EXEC_NAME}.app/$EXEC_NAME && echo YES || echo NO)"
          echo "CFBundleExecutable in packaged plist: $(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' Payload/${EXEC_NAME}.app/Info.plist)"
          zip -r Enfermicambio.ipa Payload/
          ls -lh Enfermicambio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: enfermicambio-ipa
          path: Enfermicambio.ipa
          retention-days: 30
