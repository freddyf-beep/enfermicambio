name: build-ipa

# Generates a signed iOS IPA for physical-device testing using fastlane match.
# Works with a free Apple developer account (Personal Team); the resulting
# development build installs on the registered device for up to 7 days.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MATCH_GIT_URL           URL of the private git repo holding certificates
#                           (e.g. https://github.com/you/ios-certificates)
#   MATCH_PASSWORD          password used to encrypt the match repo
#   FASTLANE_USER           Apple ID email
#   FASTLANE_PASSWORD       Apple ID password, or an app-specific password
#   MATCH_GIT_BASIC_AUTHORIZATION
#                           base64 "user:token" to access the private repo
#   TEAM_ID                 your Apple developer team ID (optional)
#
# First-time setup (run once, from a Mac with Xcode):
#   fastlane match init --git_url <MATCH_GIT_URL> --type development
#   fastlane match development
#   fastlane match development --readonly   # verify

on:
  push:
    branches: [master, main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build signed IPA (fastlane match)
    runs-on: macos-latest
    timeout-minutes: 45
    if: ${{ secrets.MATCH_GIT_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare environment placeholders
        run: Copy-Item .env.example .env -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Install fastlane
        run: |
          gem install fastlane
          fastlane --version

      - name: Match development certificates
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          MATCH_ARGS="--readonly --type development --app_identifier com.enfermicambio.enfermicambio"
          if [ -n "$TEAM_ID" ]; then
            MATCH_ARGS="$MATCH_ARGS --team_id $TEAM_ID"
          fi
          fastlane match development $MATCH_ARGS
          # Add the team to the Xcode project so signing resolves automatically.
          /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" \
            ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null \
            | head -1
          echo "Provisioning profiles installed:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ | head -5

      - name: Build iOS app (archive)
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -n "$TEAM_ID" ]; then
            sed -i '' \
              "s/PRODUCT_BUNDLE_IDENTIFIER = com.enfermicambio.enfermicambio;/PRODUCT_BUNDLE_IDENTIFIER = com.enfermicambio.enfermicambio;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;/" \
              ios/Runner.xcodeproj/project.pbxproj
          fi
          flutter build ios --release --no-codesign

      - name: Export signed IPA
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          EXPORT_OPTIONS=$RUNNER_TEMP/ExportOptions.plist
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>teamID</key>
            <string>${TEAM_ID:-}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath build/ios/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: enfermicambio-ipa
          path: build/ios/ipa/*.ipa

      - name: Show signing identity
        run: |
          security find-identity -v -p codesigning
          echo "Installed profiles:"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision \
            2>/dev/null | grep -E 'UUID|ExpirationDate|TeamName|Name' | head -10
