name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare environment placeholders
        run: Copy-Item .env.example .env -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare environment placeholders
        run: Copy-Item .env.example .env -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # iOS builds require macOS and signing. This job produces an unsigned
  # build for CI verification only; signed distribution stays manual until
  # a real Apple developer account is configured.
  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare environment placeholders
        run: Copy-Item .env.example .env -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign
